<text x="32" y="366" class="s" text-anchor="start" >Low T → nearly greedy: safe but repetitive.  High T → more variety and more misspellings.</text>
<text x="32" y="386" class="s" text-anchor="start" >The Part 12 generate() always samples at T = 1; the “COMPLETE AND UPDATED” cell adds temperature and top_k.</text>
