<text x="366.0" y="218" class="ms" text-anchor="middle" >Let</text>
<path d="M366.0,144 L366.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M366.0,228 L366.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="330" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="366.0" y="288.5" class="ml" text-anchor="middle" >&#x27;</text>
<rect x="410" y="100" width="72" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="446.0" y="126.5" class="ml" text-anchor="middle" >&#x27;</text>
<text x="446.0" y="94" class="xs" text-anchor="middle" >t=3</text>
<rect x="412" y="198" width="68" height="30" rx="6" fill="#f3f2ef"/>
<text x="446.0" y="218" class="ms" text-anchor="middle" >Let&#x27;</text>
<path d="M446.0,144 L446.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M446.0,228 L446.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="410" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="446.0" y="288.5" class="ml" text-anchor="middle" >s</text>
<rect x="490" y="100" width="72" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="526.0" y="126.5" class="ml" text-anchor="middle" >s</text>
<text x="526.0" y="94" class="xs" text-anchor="middle" >t=4</text>
<rect x="492" y="198" width="68" height="30" rx="6" fill="#f3f2ef"/>
<text x="526.0" y="218" class="ms" text-anchor="middle" >Let&#x27;s</text>
<path d="M526.0,144 L526.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M526.0,228 L526.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="490" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="526.0" y="288.5" class="ml" text-anchor="middle" >␣</text>
<rect x="570" y="100" width="72" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="606.0" y="126.5" class="ml" text-anchor="middle" >␣</text>
<text x="606.0" y="94" class="xs" text-anchor="middle" >t=5</text>
<rect x="572" y="198" width="68" height="30" rx="6" fill="#f3f2ef"/>
<text x="606.0" y="218" class="ms" text-anchor="middle" >Let&#x27;s␣</text>
<path d="M606.0,144 L606.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M606.0,228 L606.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="570" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="606.0" y="288.5" class="ml" text-anchor="middle" >h</text>
<rect x="650" y="100" width="72" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="686.0" y="126.5" class="ml" text-anchor="middle" >h</text>
<text x="686.0" y="94" class="xs" text-anchor="middle" >t=6</text>
<rect x="652" y="198" width="68" height="30" rx="6" fill="#f3f2ef"/>
<text x="686.0" y="218" class="ms" text-anchor="middle" >Let&#x27;s␣h</text>
<path d="M686.0,144 L686.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M686.0,228 L686.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="650" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="686.0" y="288.5" class="ml" text-anchor="middle" >e</text>
<rect x="730" y="100" width="72" height="44" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="766.0" y="126.5" class="ml" text-anchor="middle" >e</text>
<text x="766.0" y="94" class="xs" text-anchor="middle" >t=7</text>
<rect x="732" y="198" width="68" height="30" rx="6" fill="#f3f2ef"/>
<text x="766.0" y="218" class="ms" text-anchor="middle" >Let&#x27;s␣he</text>
<path d="M766.0,144 L766.0,196" fill="none" stroke="#8a8984" stroke-width="1.6" marker-end="url(#ahm)"/>
<path d="M766.0,228 L766.0,260" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="730" y="262" width="72" height="44" rx="10" fill="#fdf3dc" stroke="#c98500" stroke-width="1.5"/>
<text x="766.0" y="288.5" class="ml" text-anchor="middle" >a</text>
<text x="170" y="336" class="s" text-anchor="start" >At t=0 the model sees only “L” and must guess “e”; at t=7 it sees all of “Let&#x27;s he” and must guess “a”.</text>
<text x="170" y="354" class="s" text-anchor="start" >The causal mask is what stops position t from reading y[t] (= x[t+1]) during the same forward pass.</text>
<line x1="32" y1="378" x2="828" y2="378" stroke="#d6d5cf"/>
<text x="32" y="404" class="b" text-anchor="start" >Batching:</text>
<text x="120" y="404" class="m" text-anchor="start" >logits (B, T, 65) → view(B·T, 65)     targets (B, T) → view(B·T)     → F.cross_entropy</text>
<text x="32" y="430" class="b" text-anchor="start" >Loss:</text>
<text x="120" y="430" class="m" text-anchor="start" >mean over all B·T positions of  −log p(correct next char)</text>
<text x="32" y="454" class="s" text-anchor="start" >Untrained, p ≈ 1/65 for every character, so the loss starts near ln 65 ≈ 4.17 (the Part 13 run measured 4.35 at step 0).</text>
</svg>
